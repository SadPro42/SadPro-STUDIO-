<header class="site-header">

</a>  <nav class="main-navigation">
    <a href="index.html" data-i18n="home">HOME</a>

  <div class="language-switcher"><button data-language="it">ITA</button><span>/</span><button data-language="en">ENG</button></div>

<main class="inner-page contacts-page">
  <div class="page-meta"><span>CONTACT / 001</span><span>OPEN FOR WORK</span></div>
  <h1 data-i18n="contactsTitle">CONTACTS</h1>

  <div class="contact-layout">
    <div class="contact-side">
      <span class="section-number">SOCIAL / 001</span>
      <div class="social-links">
        <a href="https://instagram.com/" target="_blank" rel="noopener">INSTAGRAM ↗</a>
        <a href="https://pinterest.com/" target="_blank" rel="noopener">PINTEREST ↗</a>
      </div>
    </div>

    <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="subject" data-i18n="subject">SUBJECT</label>
      <input id="subject" name="subject" type="text" required>

      <label for="message" data-i18n="message">MESSAGE</label>
      <textarea id="message" name="message" rows="9" required></textarea>

      <button class="industrial-button" type="submit" data-i18n="send">SEND MESSAGE</button>
    </form>
  </div>
</main>

<footer class="site-footer"><div>AZIENDA est. 2026</div><div><span>STUDIO / 001</span><span>ALL RIGHTS RESERVED</span></div></footer>
